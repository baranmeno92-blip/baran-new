<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منوی کافه باران</title>
<style>
  :root {
    --bg: #faf8f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e8e2d9;
    --accent: #8b5e3c;
    --accent-light: #f5ede4;
    --badge-bg: #f0ebe4;
    --badge-text: #6b4423;
    --shadow: 0 1px 4px rgba(0,0,0,0.07);
    --radius: 12px;
}
[data-theme="dark"] {
    --bg: #16130f;
    --card: #1f1b16;
    --text: #f0ebe4;
    --muted: #9b8f82;
    --border: #2e2820;
    --accent: #c49a6c;
    --accent-light: #2a1f14;
    --badge-bg: #2a1f14;
    --badge-text: #d4a97a;
    --shadow: 0 1px 4px rgba(0,0,0,0.3);
}
  * { box-sizing: border-box; margin: 0; padding: 0;font-weight: bold;}
  body {
    font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}
  header {
    text-align: center;
    padding: 2rem 1rem 1rem;
    position: relative;
}
.logo { font-size: 2.5rem; margin-bottom: 0.2rem; color: var(--accent); }
  header h1 { font-size: 1.75rem; font-weight: 700; }
  header p { color: var(--muted); font-size: 0.9rem; }
.theme-btn {
    position: absolute; top: 1.2rem; left: 1rem;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 50%; width: 38px; height: 38px;
    cursor: pointer; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow);
}
.cats {
    display: flex; gap: 0.35rem; overflow-x: auto; padding: 0.8rem 1rem;
    justify-content: flex-start; flex-wrap: nowrap; scrollbar-width: none;
}
.cat-btn {
    border: 1px solid var(--border); background: var(--card);
    color: var(--muted); border-radius: 50px;
    padding: 0.35rem 0.8rem; cursor: pointer;
    font-size: 0.78rem; white-space: nowrap;
    transition: all 0.2s;
}
.cat-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  main { max-width: 820px; margin: 0 auto; padding: 0 0.8rem 3rem; }
.section { margin-bottom: 1.8rem; }
.section-title {
    font-size: 1.05rem; font-weight: 700; color: var(--accent);
    margin-bottom: 0.7rem; padding-bottom: 0.4rem;
    border-bottom: 2px solid var(--accent-light);
}
  /* Grid موبایل - کوچک و مربعی */
.list-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
    gap: 0.55rem;
}
.list-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem 0.7rem;
    font-size: 0.82rem;
    min-height: 62px;
    display: flex; align-items: center; gap: 0.45rem;
    box-shadow: var(--shadow);
    line-height: 1.35;
}
.list-item .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
}
.list-item .item-info { flex: 1; display: flex; flex-direction: column; gap: 0.2rem; }
.list-item .item-price { font-size: 0.72rem; color: var(--muted); font-weight: normal; }
.list-item img.item-thumb {
    width: 34px; height: 34px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
}
.empty-msg { text-align: center; color: var(--muted); padding: 2rem 0; font-size: 0.85rem; }
  /* بزرگ‌تر شدن در صفحه‌های بزرگ */
  @media (min-width: 640px) {
.list-grid {
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
}
.list-item {
      min-height: 68px;
      padding: 0.85rem 1rem;
      font-size: 0.87rem;
}
}
  footer {
    text-align: center; padding: 1.5rem 1rem;
    color: var(--muted); font-size: 0.8rem;
    border-top: 1px solid var(--border);
}
</style>
</head>
<body>
<header>
  <button class="theme-btn" onclick="toggleTheme()" title="تغییر تم">☾</button>
  <div class="logo">☕</div>
  <h1>کافه باران</h1>
  <p>لحظه‌ای از روزت را با ما باش</p>
  <p>برای دیدن دسته بندی منو نوار را به سمت راست اسکرول کنید </p>
</header>

<div class="cats" id="catsBar">
  <button class="cat-btn active" onclick="filter('all')" data-cat="all">☰ همه</button>
</div>

<main id="mainContent">
  <div class="empty-msg">در حال بارگذاری منو...</div>
</main>

<footer>
🕐 ساعت کاری: شنبه تا جمعه — ۹صبح تا ۱۲شب &nbsp;|&nbsp;<br>
09160778100</br>
</footer>

<script>
  // دسته‌بندی‌ها: شناسه، عنوان نوار دسته، عنوان بخش، ایموجی
  const CATEGORIES = [
    { id: "hot-drinks", emoji: "☕", label: "نوشیدنی گرم",     sectionTitle: "انواع نوشیدنی‌های گرم" },
    { id: "tea",         emoji: "🫖", label: "چای و دمنوش",    sectionTitle: "چای و دمنوش‌ها" },
    { id: "ice-coffee",  emoji: "🧊", label: "آیس کافی",       sectionTitle: "آیس کافی" },
    { id: "shake",       emoji: "🥤", label: "شیک",            sectionTitle: "انواع شیک" },
    { id: "smoothie",    emoji: "🍹", label: "اسموتی",         sectionTitle: "اسموتی‌ها و آبمیوه" },
    { id: "mojito",      emoji: "🍋", label: "موهیتو و لیموناد", sectionTitle: "موهیتو و لیموناد" },
    { id: "cocktail",    emoji: "🍸", label: "ماکتیل",         sectionTitle: "ماکتیل‌ها" },
    { id: "glass",       emoji: "🍨", label: "گلاسه و بستنی",  sectionTitle: "انواع گلاسه و بستنی" },
    { id: "cake",        emoji: "🍰", label: "کیک",            sectionTitle: "انواع کیک" },
    { id: "food",        emoji: "🍕", label: "غذا",            sectionTitle: "غذاهای فرنگی و فست‌فود" },
  ];

  const saved = localStorage.getItem('theme');
  if (saved === 'dark') document.documentElement.setAttribute('data-theme','dark');
  function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
  }

  function filter(cat) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-cat="'+cat+'"]').classList.add('active');
    document.querySelectorAll('.section').forEach(s => {
      s.style.display = (cat === 'all' || s.dataset.section === cat) ? 'block' : 'none';
    });
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function renderMenu(items) {
    const catsBar = document.getElementById('catsBar');
    const main = document.getElementById('mainContent');

    // فقط دسته‌هایی که آیتم دارند نوار دکمه و بخش می‌گیرند
    const usedCatIds = new Set(items.map(i => i.category));
    const activeCats = CATEGORIES.filter(c => usedCatIds.has(c.id));

    // نوار دسته‌بندی
    catsBar.innerHTML = '<button class="cat-btn active" onclick="filter(\'all\')" data-cat="all">☰ همه</button>' +
      activeCats.map(c =>
        `<button class="cat-btn" onclick="filter('${c.id}')" data-cat="${c.id}">${c.emoji} ${escapeHtml(c.label)}</button>`
      ).join('');

    if (items.length === 0) {
      main.innerHTML = '<div class="empty-msg">منو هنوز آیتمی ندارد.</div>';
      return;
    }

    // گروه‌بندی آیتم‌ها بر اساس دسته
    main.innerHTML = activeCats.map(cat => {
      const catItems = items.filter(i => i.category === cat.id);
      if (catItems.length === 0) return '';
      const itemsHtml = catItems.map(item => {
        const thumb = item.image ? `<img class="item-thumb" src="${escapeHtml(item.image)}" alt="">` : '<span class="dot"></span>';
        const priceHtml = item.price && item.price !== '-' ? `<span class="item-price">${escapeHtml(item.price)}</span>` : '';
        return `<div class="list-item">${thumb}<div class="item-info"><span>${escapeHtml(item.name)}</span>${priceHtml}</div></div>`;
      }).join('');
      return `
        <div class="section" data-section="${cat.id}">
          <div class="section-title">${cat.emoji} ${escapeHtml(cat.sectionTitle)}</div>
          <div class="list-grid">${itemsHtml}</div>
        </div>`;
    }).join('');
  }

  function loadMenu() {
    fetch(`menu-data.json?t=${Date.now()}`)
      .then(res => res.json())
      .then(data => renderMenu(Array.isArray(data) ? data : []))
      .catch(() => {
        document.getElementById('mainContent').innerHTML =
          '<div class="empty-msg">خطا در بارگذاری منو. لطفاً بعداً دوباره تلاش کنید.</div>';
      });
  }

  loadMenu();
</script>
</body>
</html>
