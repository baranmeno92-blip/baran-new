<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت - کافه باران</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white">
<div class="max-w-2xl mx-auto p-6">
<div class="flex justify-between items-center mb-8">
<h1 class="text-3xl font-bold">پنل مدیریت کافه باران</h1>
<a href="index.html" class="text-amber-400 hover:underline">← منوی مشتری</a>
</div>

<div class="bg-zinc-900 rounded-3xl p-6 mb-8">
<label class="block mb-2">GitHub Token</label>
<input type="password" id="githubToken" placeholder="ghp_..." class="w-full bg-zinc-800 p-4 rounded-2xl">
<p class="text-xs text-zinc-500 mt-2">⚠️ فقط در مرورگر شما ذخیره می‌شود. لینک این صفحه را به اشتراک نگذارید.</p>
</div>

<!-- فیلتر دسته -->
<div class="mb-6 flex flex-wrap gap-2" id="filterBar"></div>

<!-- فرم افزودن/ویرایش -->
<div class="bg-zinc-900 rounded-3xl p-6 mb-10">
<h2 class="text-xl mb-6" id="formTitle">افزودن آیتم جدید</h2>
<form id="itemForm">
<input type="hidden" id="editId">
<input id="name" placeholder="نام آیتم" class="w-full bg-zinc-800 p-4 rounded-2xl mb-4" required>
<div class="grid grid-cols-2 gap-4 mb-4">
<input id="price" placeholder="قیمت (تومان یا -)" class="bg-zinc-800 p-4 rounded-2xl" required>
<select id="category" class="bg-zinc-800 p-4 rounded-2xl" required></select>
</div>
<input id="desc" placeholder="توضیحات (اختیاری)" class="w-full bg-zinc-800 p-4 rounded-2xl mb-4">
<div class="mb-6">
<label class="block text-sm mb-2">عکس آیتم (اختیاری)</label>
<input type="file" id="imageFile" accept="image/*" class="block w-full text-sm text-zinc-300 file:mr-4 file:py-3 file:px-6 file:rounded-2xl file:bg-amber-600 file:text-white">
<div id="preview" class="hidden mt-4">
<img id="previewImg" class="max-h-52 rounded-3xl">
</div>
</div>
<div class="flex gap-3">
<button type="submit" class="flex-1 bg-green-600 py-4 rounded-3xl font-medium">ذخیره</button>
<button type="button" onclick="cancelEdit()" id="cancelBtn" class="hidden bg-zinc-700 px-6 rounded-3xl font-medium">انصراف</button>
</div>
</form>
</div>

<div id="status" class="text-center my-6"></div>

<h2 class="text-xl font-semibold mb-4">آیتم‌های فعلی (<span id="itemCount">0</span>)</h2>
<div id="adminList" class="space-y-4"></div>
</div>

<script>
const OWNER = "baranmeno92-blip"; // تغییر بده به یوزرنیم خودت
const REPO = "baran-menu";

// دسته‌بندی‌ها باید دقیقاً با index.html هماهنگ باشند
const CATEGORIES = [
  { id: "hot-drinks", emoji: "☕", label: "نوشیدنی گرم" },
  { id: "tea",         emoji: "🫖", label: "چای و دمنوش" },
  { id: "ice-coffee",  emoji: "🧊", label: "آیس کافی" },
  { id: "shake",       emoji: "🥤", label: "شیک" },
  { id: "smoothie",    emoji: "🍹", label: "اسموتی" },
  { id: "mojito",      emoji: "🍋", label: "موهیتو و لیموناد" },
  { id: "cocktail",    emoji: "🍸", label: "ماکتیل" },
  { id: "glass",       emoji: "🍨", label: "گلاسه و بستنی" },
  { id: "cake",        emoji: "🍰", label: "کیک" },
  { id: "food",        emoji: "🍕", label: "غذا" },
];

let menuItems = [];
let selectedFile = null;
let activeFilter = 'all';

function catInfo(id) {
  return CATEGORIES.find(c => c.id === id) || { id, emoji: '☕', label: id };
}

// ساخت select دسته‌بندی
const categorySelect = document.getElementById('category');
categorySelect.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.emoji} ${c.label}</option>`).join('');

// ساخت نوار فیلتر
function renderFilterBar() {
  const bar = document.getElementById('filterBar');
  bar.innerHTML = `<button onclick="setFilter('all')" class="px-4 py-2 rounded-full text-sm ${activeFilter==='all' ? 'bg-amber-600' : 'bg-zinc-800'}">همه</button>` +
    CATEGORIES.map(c => `<button onclick="setFilter('${c.id}')" class="px-4 py-2 rounded-full text-sm ${activeFilter===c.id ? 'bg-amber-600' : 'bg-zinc-800'}">${c.emoji} ${c.label}</button>`).join('');
}
function setFilter(id) {
  activeFilter = id;
  renderFilterBar();
  renderList();
}

document.getElementById('imageFile').addEventListener('change', function(e) {
  selectedFile = e.target.files[0];
  if (selectedFile) {
    const reader = new FileReader();
    reader.onload = function(ev) {
      document.getElementById('previewImg').src = ev.target.result;
      document.getElementById('preview').classList.remove('hidden');
    };
    reader.readAsDataURL(selectedFile);
  }
});

document.getElementById('itemForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const token = document.getElementById('githubToken').value.trim();
  if (!token) return alert("توکن GitHub را وارد کنید!");

  const status = document.getElementById('status');
  status.innerHTML = "در حال ذخیره...";

  const editId = document.getElementById('editId').value;
  const categoryId = document.getElementById('category').value;

  let imagePath = null;
  if (editId) {
    const existing = menuItems.find(i => i.id == editId);
    if (existing) imagePath = existing.image || null;
  }

  if (selectedFile) {
    const fileName = Date.now() + '-' + selectedFile.name.replace(/\s+/g, '-').toLowerCase();
    imagePath = `images/${fileName}`;
    const uploaded = await uploadImage(selectedFile, fileName, token);
    if (!uploaded) return status.innerHTML = `<span class="text-red-400">خطا در آپلود عکس</span>`;
  }

  try {
    const res = await fetch(`menu-data.json?t=${Date.now()}`);
    menuItems = await res.json();
    if (!Array.isArray(menuItems)) menuItems = [];
  } catch (e) { menuItems = []; }

  const newItem = {
    id: editId ? Number(editId) : Date.now(),
    name: document.getElementById('name').value,
    price: document.getElementById('price').value,
    category: categoryId,
    desc: document.getElementById('desc').value,
    image: imagePath || null,
    emoji: catInfo(categoryId).emoji
  };

  if (editId) {
    menuItems = menuItems.map(i => i.id == newItem.id ? newItem : i);
  } else {
    menuItems.push(newItem);
  }

  const saved = await saveMenuData(token);
  if (saved) {
    status.innerHTML = `<span class="text-green-400">✅ ذخیره شد</span>`;
    cancelEdit();
    loadData();
  } else {
    status.innerHTML = `<span class="text-red-400">❌ خطا در ذخیره (توکن را چک کنید)</span>`;
  }
});

function cancelEdit() {
  document.getElementById('itemForm').reset();
  document.getElementById('editId').value = '';
  document.getElementById('formTitle').innerText = 'افزودن آیتم جدید';
  document.getElementById('cancelBtn').classList.add('hidden');
  document.getElementById('preview').classList.add('hidden');
  selectedFile = null;
}

async function uploadImage(file, fileName, token) {
  const reader = new FileReader();
  return new Promise((resolve) => {
    reader.onload = async function(e) {
      const base64 = e.target.result.split(',')[1];
      try {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/images/${fileName}`, {
          method: 'PUT',
          headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify({ message: `Add image`, content: base64 })
        });
        resolve(res.ok);
      } catch { resolve(false); }
    };
    reader.readAsDataURL(file);
  });
}

async function saveMenuData(token) {
  try {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(menuItems, null, 2))));
    let sha = null;
    try {
      const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/menu-data.json`, {
        headers: { Authorization: `token ${token}` }
      });
      if (r.ok) sha = (await r.json()).sha;
    } catch(e) {}

    const putRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/menu-data.json`, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify({ message: "Update menu", content, sha })
    });
    return putRes.ok;
  } catch (err) {
    console.error(err);
    return false;
  }
}

function loadData() {
  fetch(`menu-data.json?t=${Date.now()}`)
    .then(res => res.json())
    .then(data => {
      menuItems = Array.isArray(data) ? data : [];
      renderList();
    })
    .catch(() => {
      menuItems = [];
      renderList();
    });
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

function renderList() {
  const container = document.getElementById('adminList');
  const filtered = activeFilter === 'all' ? menuItems : menuItems.filter(i => i.category === activeFilter);
  document.getElementById('itemCount').innerText = filtered.length;

  container.innerHTML = filtered.map(item => {
    const c = catInfo(item.category);
    return `
    <div class="bg-zinc-900 p-5 rounded-3xl flex gap-4">
      <div class="w-20 h-20 rounded-2xl overflow-hidden bg-zinc-800 flex-shrink-0">
        ${item.image ? `<img src="${escapeHtml(item.image)}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-4xl">${c.emoji}</div>`}
      </div>
      <div class="flex-1">
        <div class="font-bold">${escapeHtml(item.name)}</div>
        <div class="text-sm text-zinc-400">${escapeHtml(item.desc || '')}</div>
        <div class="text-amber-400">${escapeHtml(item.price)}</div>
        <div class="text-xs text-zinc-500">${c.emoji} ${c.label}</div>
      </div>
      <div class="flex flex-col gap-2">
        <button onclick="editItem(${item.id})" class="text-blue-400">ویرایش</button>
        <button onclick="deleteItem(${item.id})" class="text-red-400">حذف</button>
      </div>
    </div>
  `;
  }).join('') || `<div class="text-center text-zinc-500 py-8">آیتمی در این دسته نیست</div>`;
}

function editItem(id) {
  const item = menuItems.find(i => i.id === id);
  if (item) {
    document.getElementById('editId').value = item.id;
    document.getElementById('name').value = item.name;
    document.getElementById('price').value = item.price;
    document.getElementById('category').value = item.category;
    document.getElementById('desc').value = item.desc || '';
    document.getElementById('formTitle').innerText = 'ویرایش آیتم';
    document.getElementById('cancelBtn').classList.remove('hidden');
    if (item.image) {
      document.getElementById('previewImg').src = item.image;
      document.getElementById('preview').classList.remove('hidden');
    } else {
      document.getElementById('preview').classList.add('hidden');
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function deleteItem(id) {
  if (confirm('حذف شود؟')) {
    const token = document.getElementById('githubToken').value.trim();
    if (!token) return alert('توکن لازم است');
    menuItems = menuItems.filter(i => i.id !== id);
    renderList();
    saveMenuData(token);
  }
}

renderFilterBar();
loadData();
</script>
</body>
</html>
